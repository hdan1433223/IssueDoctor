[project]
name = "issuedoctor"
version = "0.1.0"
description = "Explainable GitHub issue workflow health auditing and governance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "Flask==3.1.3",
  "Flask-Migrate==4.1.0",
  "Flask-SQLAlchemy==3.1.1",
  "Flask-WTF==1.2.2",
  "gunicorn==23.0.0",
  "httpx==0.28.1",
  "keyring==25.6.0",
  "pydantic==2.11.9",
  "PyYAML==6.0.3",
  "openai==2.6.1",
  "SQLAlchemy==2.0.43",
]

# 可选能力按需安装，核心安装不拉取任何重型科学计算或浏览器依赖：
#   pip install "issuedoctor[vector]"     本地语义向量（会连带安装 PyTorch）
#   pip install "issuedoctor[pdf]"        服务端 PDF 导出（Playwright + Chromium）
#   pip install "issuedoctor[full]"       全部可选能力
[project.optional-dependencies]
vector = ["sentence-transformers==5.1.1", "numpy==2.2.6"]
pdf = ["playwright==1.55.0"]
full = ["sentence-transformers==5.1.1", "numpy==2.2.6", "playwright==1.55.0"]
dev = [
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.13.2",
  "pandas==2.3.2",
  "scikit-learn==1.7.1",
  "pypdf==6.1.1",
]

[project.scripts]
issuedoctor = "issuedoctor.cli:main"

[tool.setuptools.packages.find]
include = ["issuedoctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["migrations", ".venv", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["issuedoctor"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
