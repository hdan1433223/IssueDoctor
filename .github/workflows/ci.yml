name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      ISSUEDOCTOR_DATA_DIR: ${{ github.workspace }}/.ci-data
      ISSUEDOCTOR_DOCKER: "1"
      ISSUEDOCTOR_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run build
      - run: python -m ruff check .
      - run: python -m flask --app wsgi db upgrade
      - run: python -m pytest --cov=issuedoctor --cov-report=term-missing --cov-fail-under=80
      - run: python -m pytest tests/unit/test_scoring.py --cov=issuedoctor.scoring --cov-fail-under=95
      - run: python -m pytest tests/unit/test_github_client.py tests/unit/test_collector.py --cov=issuedoctor.github.client --cov=issuedoctor.github.collector --cov-fail-under=90
      - run: python -m pytest tests/unit/test_input_validation.py tests/unit/test_secrets.py tests/unit/test_logging.py tests/unit/test_governance.py tests/unit/test_settings.py --cov=issuedoctor.security --cov-fail-under=90
      - run: python -m evaluation.scripts.compute_metrics
      - run: python -m evaluation.scripts.run_simulation

  frontend-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- issuedoctor/static
