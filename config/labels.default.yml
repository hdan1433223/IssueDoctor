type_groups:
  bug: [bug, type:bug, defect, error, 错误, 缺陷]
  feature: [feature, enhancement, type:feature, 功能, 新功能]
  question: [question, support, type:question, 问题, 求助]
  documentation: [documentation, docs, type:docs, 文档]
synonym_groups:
  - [bug, defect, type:bug, 错误, 缺陷]
  - [feature, enhancement, type:feature, 功能, 新功能]
  - [documentation, docs, type:docs, 文档]
  - [question, support, type:question, 问题, 求助]
bug_title_keywords: [bug, error, crash, fail, broken, exception, 报错, 错误, 崩溃, 失败, 异常]
bug_fields:
  version:
    weight: 15
    aliases: [version, version number, 版本, 版本号]
  environment:
    weight: 15
    aliases: [environment, operating system, os, platform, 环境, 操作系统, 平台]
  reproduction_steps:
    weight: 25
    aliases: [steps to reproduce, reproduction, reproduce, 复现步骤, 如何复现]
  expected_result:
    weight: 15
    aliases: [expected behavior, expected result, 预期行为, 预期结果]
  actual_result:
    weight: 15
    aliases: [actual behavior, actual result, 实际行为, 实际结果]
  logs:
    weight: 10
    aliases: [logs, log output, error message, stack trace, 日志, 错误信息, 堆栈]
  context:
    weight: 5
    aliases: [minimal example, reproduction repository, additional context, 最小示例, 补充信息]

