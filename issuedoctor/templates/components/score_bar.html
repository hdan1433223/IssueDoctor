<div class="grid grid-cols-[3rem_minmax(0,1fr)_3rem] items-center gap-3 text-sm">
  <span class="font-medium">{{ item.code }}</span>
  <div class="h-2 bg-slate-200" aria-hidden="true">
    <div class="h-full {% if item.score is none %}bg-slate-300{% elif item.score >= 75 %}bg-success{% elif item.score >= 45 %}bg-amber-500{% else %}bg-red-600{% endif %}" style="width: {{ item.score if item.score is not none else 0 }}%"></div>
  </div>
  <span class="text-right font-mono text-xs">{{ 'N/A' if item.score is none else '%.1f'|format(item.score) }}</span>
</div>
